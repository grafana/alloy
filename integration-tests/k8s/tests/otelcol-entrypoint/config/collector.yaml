extensions:
  health_check:
    endpoint: 0.0.0.0:13133

# A plain collector pipeline, with no alloyengine extension. otel-gen sends
# here through the alloy-otel Service.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Only this pipeline adds the label the assertions select on, so a metric
  # found in Mimir went through it.
  attributes:
    actions:
      - key: alloy_test_name
        value: otelcol-entrypoint
        action: insert
  batch:

exporters:
  otlphttp:
    endpoint: http://mimir:9009/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [attributes, batch]
      exporters: [otlphttp]
