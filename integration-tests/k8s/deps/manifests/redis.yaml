apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:6.2.22-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-seed
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: redis:6.2.22-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until redis-cli -h redis -p 6379 ping >/dev/null 2>&1; do sleep 1; done
              redis-cli -h redis -p 6379 SET test_key_1 "value1"
              redis-cli -h redis -p 6379 SET test_key_2 "value2"
              redis-cli -h redis -p 6379 SET test_key_3 "value3"
              redis-cli -h redis -p 6379 SET expiring_key_1 "expires1" EX 3600
              redis-cli -h redis -p 6379 SET expiring_key_2 "expires2" EX 7200
              redis-cli -h redis -p 6379 -n 1 SET db1_key_1 "db1_value1"
              redis-cli -h redis -p 6379 -n 1 SET db1_key_2 "db1_value2" EX 1800
