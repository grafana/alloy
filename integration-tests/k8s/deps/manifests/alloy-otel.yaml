---
# Alloy running the OTel engine (`alloy otel`). An alloyengine extension in the
# collector config runs the inner Alloy config mounted as config.alloy, if any.
# __ALLOY_OTEL_COMMAND__ is `alloy otel` or the image's /bin/otelcol wrapper,
# and __ALLOY_IMAGE__ is the image under test. The AlloyOtel dependency
# substitutes both at install time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-otel
  labels:
    app: alloy-otel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-otel
  template:
    metadata:
      labels:
        app: alloy-otel
    spec:
      containers:
        - name: alloy
          image: __ALLOY_IMAGE__
          imagePullPolicy: Never
          command: __ALLOY_OTEL_COMMAND__
          args:
            - --config=/etc/alloy/collector.yaml
          ports:
            - name: health
              containerPort: 13133
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: 13133
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-otel-config
---
# Lets in-cluster senders such as otel-gen reach an OTLP HTTP receiver that the
# config under test listens on at 0.0.0.0:4318.
apiVersion: v1
kind: Service
metadata:
  name: alloy-otel
  labels:
    app: alloy-otel
spec:
  selector:
    app: alloy-otel
  ports:
    - port: 4318
      targetPort: 4318
      name: otlp-http
