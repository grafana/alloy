apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

    CREATE ROLE monitoring_user LOGIN PASSWORD 'monitoring_password';
    GRANT pg_monitor TO monitoring_user;
    GRANT pg_read_all_stats TO monitoring_user;
    ALTER ROLE monitoring_user SET pg_stat_statements.track = 'none';
    GRANT USAGE ON SCHEMA public TO monitoring_user;

    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        quantity INT DEFAULT 0
    );
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        product_id INT,
        quantity INT NOT NULL,
        total DECIMAL(10, 2) NOT NULL,
        status VARCHAR(50) DEFAULT 'pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO products (name, price, quantity) VALUES
        ('Widget', 19.99, 100),
        ('Gadget', 29.99, 50),
        ('Gizmo', 39.99, 25);
    INSERT INTO orders (product_id, quantity, total, status) VALUES
        (1, 2, 39.98, 'completed'),
        (2, 1, 29.99, 'pending'),
        (3, 3, 119.97, 'shipped');

    GRANT SELECT ON ALL TABLES IN SCHEMA public TO monitoring_user;

    SELECT * FROM products WHERE id = 1;
    SELECT * FROM products WHERE price > 20;
    SELECT * FROM orders WHERE status = 'pending';
    SELECT p.name, o.total FROM products p JOIN orders o ON p.id = o.product_id;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "root"
            - name: POSTGRES_PASSWORD
              value: "rootpassword"
            - name: POSTGRES_DB
              value: "testdb"
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "root", "-d", "testdb"]
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 60
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
