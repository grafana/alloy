apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmpsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmpsim
  template:
    metadata:
      labels:
        app: snmpsim
    spec:
      containers:
        - name: snmpsim
          # Only published for linux/amd64.
          image: tandrup/snmpsim:v0.4@sha256:a080b493042d91c4cec9282a83403e334660ed1c2c71e7e3afa920c3f1c42d7e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 161
              protocol: UDP
              name: snmp
---
apiVersion: v1
kind: Service
metadata:
  name: snmpsim
  labels:
    app: snmpsim
spec:
  selector:
    app: snmpsim
  ports:
    - port: 161
      targetPort: 161
      protocol: UDP
      name: snmp
