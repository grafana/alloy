services:
  alloy:
    image: alloy-integration-tests
    environment:
      OTEL_EBPF_JAVAAGENT_ATTACH_TIMEOUT: "30s"
    command:
      [
        "run",
        "/etc/alloy/config.alloy",
        "--server.http.listen-addr",
        "0.0.0.0:12345",
        "--stability.level",
        "experimental"
      ]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    privileged: true
    cap_add:
      - "SYS_ADMIN"
      - "SYS_PTRACE"
      - "SYS_RESOURCE"
    security_opt:
      - "apparmor:unconfined"
    pid: "host"
    depends_on:
      java-app:
        condition: service_started
    networks:
      - default
      - alloy-integration-tests_integration-tests

  java-app:
    image: springcommunity/spring-framework-petclinic:latest
    environment:
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "18080:8080"
    networks:
      - default

  # The distroless Alloy image has no bash, nc or similar tools, so its readiness can't be probed from inside the container.
  # This sidecar waits for Alloy's HTTP port instead, so `docker compose up --wait` returns once Alloy is ready.
  alloy-ready:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-z", "alloy", "12345"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - default

networks:
  alloy-integration-tests_integration-tests:
    external: true
