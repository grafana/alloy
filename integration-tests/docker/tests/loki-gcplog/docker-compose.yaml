services:
  pubsub-emulator:
    image: messagebird/gcloud-pubsub-emulator@sha256:7ac0917f6278e3c1d27ecc3d390edfe913b66887ea23af9d3aa459e766ed736c
    environment:
      # Pre-create the topic+subscription pair on boot so Alloy can start subscribing
      # immediately and the test publisher has a topic to publish to.
      PUBSUB_PROJECT1: "test-project,gcplog-topic:gcplog-subscription"
    ports:
      - "8681:8681"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8681 || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 10s

  alloy:
    image: alloy-integration-tests
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr
      - 0.0.0.0:12345
      - --stability.level
      - generally-available
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8681
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "1518:1518"
    networks:
      - default
      - alloy-integration-tests_integration-tests

  # The distroless Alloy image has no bash, nc or similar tools, so its readiness can't be probed from inside the container.
  # This sidecar waits for Alloy's HTTP port instead, so `docker compose up --wait` returns once Alloy is ready.
  alloy-ready:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-z", "alloy", "12345"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - default

networks:
  alloy-integration-tests_integration-tests:
    external: true
