services:
  alloy:
    image: alloy-integration-tests
    command:
      [
        "run",
        "/etc/alloy/config.alloy",
        "--server.http.listen-addr",
        "0.0.0.0:12345",
        "--stability.level",
        "experimental"
      ]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - default
      - alloy-integration-tests_integration-tests

  # The distroless Alloy image has no bash, nc or similar tools, so its readiness can't be probed from inside the container.
  # This sidecar waits for the OTLP receiver port instead, so otel-gen starts sending only once Alloy is ready.
  alloy-ready:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-z", "alloy", "4318"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - default

  otel-gen:
    build:
      context: ../../../../
      dockerfile: ./integration-tests/docker/configs/otel-gen/Dockerfile
    environment:
      - OTEL_EXPORTER_ENDPOINT=alloy:4318
    depends_on:
      alloy-ready:
        condition: service_healthy
    networks:
      - default

networks:
  alloy-integration-tests_integration-tests:
    external: true
