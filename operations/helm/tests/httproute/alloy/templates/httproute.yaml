---
# Source: alloy/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy
  namespace: default
  labels:
    helm.sh/chart: alloy
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: "vX.Y.Z"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: networking
    team: telemetry
  annotations:
    example.com/owner: "platform"
spec:
  parentRefs:
    - name: chart-example-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "chart-example.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: alloy
          port: 12347
      timeouts:
        request: 10s
