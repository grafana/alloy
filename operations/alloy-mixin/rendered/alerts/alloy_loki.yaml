"groups":
- "name": "alloy_loki"
  "rules":
  - "alert": "LokiWriteDroppedEntries"
    "annotations":
      "description": "loki.write component {{ $labels.component_id }} under job {{ $labels.job }} dropped log entries for host {{ $labels.host }} with reason {{ $labels.reason }}."
      "summary": "loki.write is dropping log entries."
    "expr": "sum by (cluster, namespace, job, component_path, component_id, host, reason) (increase(loki_write_dropped_entries_total[10m])) > 0"
    "for": "5m"
    "labels":
      "severity": "warning"
  - "alert": "LokiWriteWALWriteFailures"
    "annotations":
      "description": "loki.write component {{ $labels.component_id }} under job {{ $labels.job }} failed to write log entries to the WAL. Check the free disk space for the WAL directory."
      "summary": "loki.write is failing to write log entries to the WAL."
    "expr": "sum by (cluster, namespace, job, component_path, component_id) (increase(loki_write_wal_writer_failed_entries_total[10m])) > 0"
    "for": "5m"
    "labels":
      "severity": "warning"
  - "alert": "LokiWriteWALStreamNotFound"
    "annotations":
      "description": "loki.write component {{ $labels.component_id }} under job {{ $labels.job }} dropped log entries read from the WAL for endpoint {{ $labels.id }} because their stream was not found."
      "summary": "loki.write is dropping WAL entries with an unknown stream."
    "expr": "sum by (cluster, namespace, job, component_path, component_id, id) (increase(loki_write_wal_entries_stream_not_found_total[10m])) > 0"
    "for": "5m"
    "labels":
      "severity": "warning"
  - "alert": "LokiWriteSustainedRetries"
    "annotations":
      "description": "loki.write component {{ $labels.component_id }} under job {{ $labels.job }} has retried batches to host {{ $labels.host }} for 15 minutes. The endpoint may be unreachable."
      "summary": "loki.write is continuously retrying batches."
    "expr": "sum by (cluster, namespace, job, component_path, component_id, host) (rate(loki_write_batch_retries_total[5m])) > 0"
    "for": "15m"
    "labels":
      "severity": "warning"