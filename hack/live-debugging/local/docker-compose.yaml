services:
  tempo:
    image: grafana/tempo:2.6.1 # 3.0.0 ("latest") breaks this config's schema -- pin to 2.6.1.
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo API / query
      - "4319:4319" # OTLP gRPC, matches local-gatherer.yaml's otlp/tempo exporter

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100" # push API, used by log-shipper.alloy; also Grafana's Loki datasource

  prometheus:
    image: prom/prometheus:latest
    # --web.enable-lifecycle: run-local.sh's pod-reconciliation loop
    # rewrites prometheus.yml as pods come and go, and POSTs /-/reload
    # to pick it up without restarting the container.
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed on Linux; already default on Docker Desktop for Mac/Windows
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  tempo-data:
  loki-data:
