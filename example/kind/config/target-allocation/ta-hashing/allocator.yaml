---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: target-allocator
  namespace: target-allocation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: target-allocator
  namespace: target-allocation
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: target-allocator
  namespace: target-allocation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: target-allocator
subjects:
- kind: ServiceAccount
  name: target-allocator
  namespace: target-allocation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: target-allocator
  namespace: target-allocation
data:
  targetallocator.yaml: |
    collector_namespace: target-allocation
    collector_selector:
      matchLabels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: alloy-target-allocation
    allocation_strategy: consistent-hashing
    filter_strategy: relabel-config
    prometheus_cr:
      enabled: false
    listen_addr: ":8080"
    config:
      scrape_configs:
      - job_name: target-allocation
        scrape_interval: 30s
        scrape_timeout: 10s
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - target-allocation
          selectors:
          - role: pod
            label: app.kubernetes.io/part-of=target-allocation-targets
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_pod_ready
          - __meta_kubernetes_pod_container_port_name
          regex: true;metrics
          action: keep
        - source_labels:
          - __meta_kubernetes_pod_name
          target_label: instance
        - source_labels:
          - __meta_kubernetes_pod_label_size_class
          target_label: size_class
---
apiVersion: v1
kind: Service
metadata:
  name: target-allocator
  namespace: target-allocation
spec:
  selector:
    app.kubernetes.io/name: target-allocator
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-allocator
  namespace: target-allocation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: target-allocator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: target-allocator
    spec:
      serviceAccountName: target-allocator
      containers:
      - name: target-allocator
        image: target-allocator-local:demo
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: http
        livenessProbe:
          httpGet:
            path: "/livez"
            port: http
          initialDelaySeconds: 10
        volumeMounts:
        - name: config
          mountPath: "/conf"
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: target-allocator
