---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: target-allocator
  namespace: target-allocation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: target-allocator
  namespace: target-allocation
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: target-allocator
  namespace: target-allocation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: target-allocator
subjects:
- kind: ServiceAccount
  name: target-allocator
  namespace: target-allocation
---
apiVersion: v1
kind: Service
metadata:
  name: target-allocator
  namespace: target-allocation
spec:
  selector:
    app.kubernetes.io/name: target-allocator
  ports:
  - name: http
    port: 8080
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-allocator
  namespace: target-allocation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: target-allocator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: target-allocator
    spec:
      serviceAccountName: target-allocator
      containers:
      - name: target-allocator
        image: target-allocator-local:demo
        imagePullPolicy: Never
        ports:
        - name: metrics
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: metrics
        livenessProbe:
          httpGet:
            path: "/livez"
            port: metrics
          initialDelaySeconds: 10
        volumeMounts:
        - name: config
          mountPath: "/conf"
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: target-allocator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: target-allocator
  namespace: kube-system
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: target-allocator
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: target-allocator
subjects:
- kind: ServiceAccount
  name: target-allocator
  namespace: target-allocation
