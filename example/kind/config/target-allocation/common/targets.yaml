---
apiVersion: v1
kind: Service
metadata:
  name: targets
  namespace: target-allocation
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: target-allocation-targets
  ports:
  - name: metrics
    port: 9001
    targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: targets-large
  namespace: target-allocation
spec:
  serviceName: targets
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/part-of: target-allocation-targets
      size_class: large
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: target-allocation-targets
        size_class: large
        service: inventory-exporter
        team: platform
        region: eu-west-1
        environment: demo
    spec:
      containers:
      - name: prom-gen
        image: prom-gen:latest
        imagePullPolicy: Never
        command:
        - "/app/main"
        args:
        - "--series=800"
        ports:
        - name: metrics
          containerPort: 9001
        readinessProbe:
          httpGet:
            path: "/metrics"
            port: metrics
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
