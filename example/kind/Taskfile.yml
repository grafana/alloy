version: "3"
dotenv: [.env.credentials]
vars:
  KUBECONFIG: build/kubeconfig.yaml
  CLUSTERNAME: alloy-example
env:
  KUBECONFIG: '{{.KUBECONFIG}}'
  CLUSTERNAME: '{{.CLUSTERNAME}}'
tasks:
  demo:simulations:
    desc: Serve the simulation comparison page for recording (localhost:8091)
    cmds: [node config/target-allocation/simulation-report/serve.mjs]
  demo:dashboard:
    desc: Publish the checked-in comparison dashboard to the private demo stack
    cmds:
      - gcx --context thampiotr resources validate -p config/target-allocation/dashboard -o json
      - gcx --context thampiotr resources push -p config/target-allocation/dashboard
  demo:prepare:
    desc: Build and load demo images once before recording
    cmds:
      - task: demo:targets
      - bash config/target-allocation/build-ta.sh
  demo:mode:
    desc: Switch deployment using prepared images (MODE=vanilla, ta-hashing or ta-packing)
    requires:
      vars: [MODE]
    cmds: ['bash config/target-allocation/demo.sh mode "{{.MODE}}"']
  demo:alloys:
    desc: Scale Alloy to 3, 4 or 5 instances
    requires:
      vars: [REPLICAS]
    cmds: ['bash config/target-allocation/demo.sh alloys "{{.REPLICAS}}"']
  demo:targets:extra:
    desc: Add eight mixed-size targets
    cmds: [bash config/target-allocation/demo.sh extra]
  demo:targets:reset:
    desc: Remove the extra target batch
    cmds: [bash config/target-allocation/demo.sh targets-reset]
  demo:reset:
    desc: Restore three Alloy instances and the base target pool
    cmds: [bash config/target-allocation/demo.sh reset]
  demo:profiles:
    desc: Capture local Alloy heap and short CPU profiles
    cmds: [bash config/target-allocation/demo.sh profiles]
  ui:ta:
    desc: Open the TA allocation explorer through a local port-forward
    vars:
      PORT: '{{.PORT | default "8080"}}'
    cmds:
      - 'echo "Target Allocator: http://localhost:{{.PORT}}/debug/allocation"'
      - 'kubectl --context kind-{{.CLUSTERNAME}} -n target-allocation port-forward --address 127.0.0.1 service/target-allocator {{.PORT}}:8080'
  cluster:up:
    desc: Start the single-node demo cluster (only one kind cluster at a time)
    cmds: [bash config/target-allocation/cluster.sh up]
  cluster:down:
    desc: Delete the demo cluster and stop its workloads
    cmds: [bash config/target-allocation/cluster.sh down]
  deploy:vanilla:
    desc: Deploy Alloy clustering with discovery on every peer
    cmds:
      - task: demo:targets
      - bash config/target-allocation/deploy.sh vanilla
  deploy:ta-hashing:
    desc: Build local TA and deploy consistent hashing with Alloy HTTP discovery
    cmds:
      - task: demo:targets
      - bash config/target-allocation/deploy.sh ta-hashing
  deploy:ta-packing:
    desc: Build local TA and deploy sticky allocation with asynchronous size probes
    cmds:
      - task: demo:targets
      - bash config/target-allocation/deploy.sh ta-packing
  demo:targets:
    internal: true
    cmds:
      - bash config/target-allocation/cluster.sh check
      - make -C ../.. prom-gen-image
      - '{{.KIND | default "kind"}} load docker-image prom-gen:latest --name {{.CLUSTERNAME}}'

  update-helm-repos:
    desc: Update helm repositories
    run: once
    cmds:
      - helm repo add grafana https://grafana.github.io/helm-charts
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      - helm repo update

  deploy:alloy-helm:
    desc: Deploy local Grafana Alloy helm chart
    deps: [cluster:up]
    vars:
      ALLOY_VALUES_FILE: '{{.ALLOY_VALUES_FILE | default "config/alloy-helm/basic.yaml"}}'
      ALLOY_CHART_PATH: '{{.TASK_DIR}}/../../operations/helm/charts/alloy'
    preconditions:
      - test -f {{.ALLOY_VALUES_FILE}}
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} upgrade --install alloy {{.ALLOY_CHART_PATH}}
        -n monitoring --create-namespace
        -f {{.ALLOY_VALUES_FILE}}
        --wait

  deploy:cloud-onboarding:local:
    desc: Deploy Grafana Cloud Onboarding helm chart
    deps: [cluster:up, update-helm-repos]
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} upgrade --install grafana-cloud
        -n monitoring --create-namespace
        grafana/grafana-cloud-onboarding
        --set "cluster.name=example-kind-cluster"
        --set "grafanaCloud.fleetManagement.auth.password={{.GRAFANA_CLOUD_API_KEY}}"
        --set "grafanaCloud.fleetManagement.auth.username={{.REMOTE_CFG_USERNAME}}"
        --set "grafanaCloud.fleetManagement.url={{.REMOTE_CFG_URL}}"
        --wait

  deploy:otelcol:
    desc: Deploy OpenTelemetry Collector helm chart using Alloy OTel Engine
    deps: [cluster:up, update-helm-repos]
    vars:
      OTELCOL_VALUES_FILE: '{{.OTELCOL_VALUES_FILE | default "config/otelcol-helm/values.yaml"}}'
    preconditions:
      - test -f {{.OTELCOL_VALUES_FILE}}
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} upgrade --install otelcol
        -n monitoring --create-namespace
        open-telemetry/opentelemetry-collector
        -f {{.OTELCOL_VALUES_FILE}}
        --wait

  remove:cloud-onboarding:local:
    desc: Remove Grafana Cloud Onboarding helm chart
    deps: [update-helm-repos]
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} uninstall grafana-cloud -n monitoring

  expose:
    desc: Expose all services on localhost via port-forward
    deps: [deploy:cloud-onboarding:local]
    cmds:
      - "{{.TASK_DIR}}/config/expose.sh {{.KUBECONFIG}}"
