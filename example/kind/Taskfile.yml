# Install the task command from here: https://taskfile.dev
# It's a much more human-friendly version of Makefiles.

version: "3"

dotenv:
  - .env.credentials

vars:
  KUBECONFIG: build/kubeconfig.yaml
  CLUSTERNAME: alloy-example

tasks:
  target-allocation:local:
    desc: Build TA from the operator checkout, load it into the existing cluster, and switch
    cmds:
      - python3 config/target-allocation/local.py --operator-dir '{{.OPERATOR_DIR | default "~/workspace/opentelemetry-operator"}}' --settings '{{.SETTINGS | default "config/target-allocation/settings.json"}}' --kubeconfig '{{.KUBECONFIG}}' --cluster '{{.CLUSTERNAME}}'

  target-allocation:switch:
    desc: Switch Alloy or TA allocation without rebuilding images or changing target pods
    requires:
      vars: [MODE]
    preconditions:
      - sh: |
          clusters=$(docker ps --filter label=io.x-k8s.kind.cluster --format '{{`{{.Label "io.x-k8s.kind.cluster"}}`}}') &&
          test -z "$(printf '%s\n' "$clusters" | grep -vx '{{.CLUSTERNAME}}')"
        msg: Stop other running kind clusters before switching the demo.
    cmds:
      - python3 config/target-allocation/demo.py switch --mode '{{.MODE}}' --strategy '{{.STRATEGY | default "consistent-hashing"}}' --settings '{{.SETTINGS | default "config/target-allocation/settings.json"}}' --kubeconfig '{{.KUBECONFIG}}' --cluster '{{.CLUSTERNAME}}'

  target-allocation:verify:
    desc: Verify TA assignments match healthy Alloy scrapes with no mounted Kubernetes token
    cmds:
      - python3 config/target-allocation/verify.py --kubeconfig '{{.KUBECONFIG}}' --cluster '{{.CLUSTERNAME}}'

  target-allocation:render:
    desc: Render the scrape allocation baseline and print its ingestion size
    cmds:
      - python3 config/target-allocation/demo.py render --settings '{{.SETTINGS | default "config/target-allocation/settings.json"}}'

  target-allocation:up:
    desc: Deploy the skewed clustered Alloy baseline to kind
    cmds:
      - task: target-allocation:cluster
      - make -C ../.. prom-gen-image
      - kind load docker-image prom-gen:latest --name {{.CLUSTERNAME}}
      - python3 config/target-allocation/demo.py up --settings '{{.SETTINGS | default "config/target-allocation/settings.json"}}' --kubeconfig '{{.KUBECONFIG}}' --cluster '{{.CLUSTERNAME}}'

  target-allocation:cluster:
    desc: Create a single-node demo cluster, refusing to run alongside another kind cluster
    preconditions:
      - sh: |
          clusters=$(docker ps --filter label=io.x-k8s.kind.cluster --format '{{`{{.Label "io.x-k8s.kind.cluster"}}`}}') &&
          test -z "$(printf '%s\n' "$clusters" | grep -vx '{{.CLUSTERNAME}}')"
        msg: Stop other running kind clusters before starting the demo.
    cmds:
      - task: cluster:create
        vars:
          KIND_CONFIG: config/target-allocation/kind.yaml

  target-allocation:status:
    desc: Show the scrape allocation demo pods
    cmds:
      - python3 config/target-allocation/demo.py status --kubeconfig '{{.KUBECONFIG}}' --cluster '{{.CLUSTERNAME}}'

  target-allocation:down:
    desc: Remove the demo namespace and stop Cloud ingestion, keeping kind
    cmds:
      - python3 config/target-allocation/demo.py down --kubeconfig '{{.KUBECONFIG}}' --cluster '{{.CLUSTERNAME}}'

  cluster:create:
    desc: Create a kind cluster
    run: once
    status:
      - test -f {{.KUBECONFIG}} && kubectl --kubeconfig {{.KUBECONFIG}} cluster-info &>/dev/null
    cmds:
      - mkdir -p build
      - kind create cluster --config '{{.KIND_CONFIG | default "config/kind/multinode.yaml"}}' --name {{.CLUSTERNAME}} --kubeconfig {{.KUBECONFIG}}

  cluster:delete:
    desc: Delete the kind cluster
    run: once
    cmds:
      - kind delete cluster --name {{.CLUSTERNAME}}
      - rm -rf {{.KUBECONFIG}}

  update-helm-repos:
    desc: Update helm repositories
    run: once
    cmds:
      - helm repo add grafana https://grafana.github.io/helm-charts
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      - helm repo update

  deploy:alloy-helm:
    desc: Deploy local Grafana Alloy helm chart
    deps: [cluster:create]
    vars:
      ALLOY_VALUES_FILE: '{{.ALLOY_VALUES_FILE | default "config/alloy-helm/basic.yaml"}}'
      ALLOY_CHART_PATH: '{{.TASK_DIR}}/../../operations/helm/charts/alloy'
    preconditions:
      - test -f {{.ALLOY_VALUES_FILE}}
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} upgrade --install alloy {{.ALLOY_CHART_PATH}}
        -n monitoring --create-namespace
        -f {{.ALLOY_VALUES_FILE}}
        --wait

  deploy:cloud-onboarding:local:
    desc: Deploy Grafana Cloud Onboarding helm chart
    deps: [cluster:create, update-helm-repos]
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} upgrade --install grafana-cloud
        -n monitoring --create-namespace
        grafana/grafana-cloud-onboarding
        --set "cluster.name=example-kind-cluster"
        --set "grafanaCloud.fleetManagement.auth.password={{.GRAFANA_CLOUD_API_KEY}}"
        --set "grafanaCloud.fleetManagement.auth.username={{.REMOTE_CFG_USERNAME}}"
        --set "grafanaCloud.fleetManagement.url={{.REMOTE_CFG_URL}}"
        --wait

  deploy:otelcol:
    desc: Deploy OpenTelemetry Collector helm chart using Alloy OTel Engine
    deps: [cluster:create, update-helm-repos]
    vars:
      OTELCOL_VALUES_FILE: '{{.OTELCOL_VALUES_FILE | default "config/otelcol-helm/values.yaml"}}'
    preconditions:
      - test -f {{.OTELCOL_VALUES_FILE}}
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} upgrade --install otelcol
        -n monitoring --create-namespace
        open-telemetry/opentelemetry-collector
        -f {{.OTELCOL_VALUES_FILE}}
        --wait

  remove:cloud-onboarding:local:
    desc: Remove Grafana Cloud Onboarding helm chart
    deps: [update-helm-repos]
    cmds:
      - helm --kubeconfig {{.KUBECONFIG}} uninstall grafana-cloud -n monitoring

  expose:
    desc: Expose all services on localhost via port-forward
    deps: [deploy:cloud-onboarding:local]
    cmds:
      - "{{.TASK_DIR}}/config/expose.sh {{.KUBECONFIG}}"
