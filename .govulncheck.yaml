# Ignore list for the govulncheck CI job.
#
# Every entry needs a `reason` so the rationale lives in git history.
# The optional `expires` field forces periodic re-evaluation: once that
# date passes, CI starts failing on the entry again until it's renewed
# or removed. See tools/govulncheck/ for the wrapper that consumes this.

ignore:
  - id: GO-2026-4887
    reason: |
      Moby AuthZ plugin bypass (CVE-2026-34040). Reachable from Alloy only
      because the cadvisor static integration (via github.com/google/cadvisor)
      imports the legacy github.com/docker/docker client. The vulnerability is
      server-side (Docker daemon processing API requests through an AuthZ
      plugin) — Alloy never runs as a Docker daemon, only as a client. The fix
      exists in moby v2.0.0-beta.8 but the legacy github.com/docker/docker
      module path will never get a patched release; revisit once
      google/cadvisor drops the legacy github.com/docker/docker dependency.
    expires: 2027-01-01

  - id: GO-2026-4883
    reason: |
      Moby off-by-one in plugin privilege validation (CVE-2026-33997).
      Vulnerable code path is `docker plugin install` on a Docker daemon
      — Alloy never processes plugin installs. Same upstream-fix story
      as GO-2026-4887 (only fixed in github.com/moby/moby/v2).
    expires: 2027-01-01

  - id: GO-2026-5746
    reason: |
      Docker PUT /containers/{id}/archive runs a container binary on the
      host (CVE-2026-41567, RCE). Daemon-side handler. The vulnerable
      github.com/docker/docker enters the build only through the cadvisor
      static integration (github.com/google/cadvisor still uses the legacy
      docker/docker client); Alloy uses it for outbound Docker API queries
      and never runs dockerd or serves that handler, so it's unreachable.
      Prometheus's own Docker/Swarm SD already moved to github.com/moby/moby
      and isn't flagged here. No fix in github.com/docker/docker (only
      moby/moby/v2 v2.0.0-beta.14). Same story as GO-2026-4887/4883; revisit
      once google/cadvisor drops the legacy docker/docker dependency.
    expires: 2027-01-01

  - id: GO-2026-5668
    reason: |
      Race in docker cp lets a container create arbitrary empty host files
      via symlink swap (CVE-2026-41568). Daemon-side docker cp path. The
      only reachable importer of github.com/docker/docker is the cadvisor
      integration (via github.com/google/cadvisor); Alloy makes outbound
      Docker API calls only, never runs dockerd or docker cp. No fix in
      github.com/docker/docker (only moby/moby/v2 v2.0.0-beta.14). Revisit
      once google/cadvisor drops the legacy docker/docker dependency.
    expires: 2027-01-01

  - id: GO-2026-5617
    reason: |
      Race in docker cp redirects a bind mount to an arbitrary host path
      (CVE-2026-42306). Daemon-side docker cp path, unreachable: Alloy pulls
      github.com/docker/docker only through the cadvisor integration (via
      github.com/google/cadvisor) and uses it for outbound Docker API
      queries, never dockerd or docker cp. No fix in github.com/docker/docker
      (only moby/moby/v2 v2.0.0-beta.14). Revisit once google/cadvisor drops
      the legacy docker/docker dependency.
    expires: 2027-01-01

  - id: GO-2026-5662
    reason: |
      Stored XSS via metric names and label values in the Prometheus web UI
      tooltips and metrics explorer (CVE-2026-40179). Alloy embeds Prometheus
      as a library for scrape/TSDB/remote-write and never serves that web UI,
      so the vulnerable rendering path is unreachable. govulncheck flags it
      only because the advisory has no symbol-level data and matches generic
      tsdb/remote-write symbols Alloy does call. No fix on the prometheus
      v3.12 line; revisit when a v3.12.x backport lands or we move to v3.13.
    expires: 2027-01-01

  # The following github.com/lib/pq entries (GO-2026-6166, 6168-6173) all landed
  # the same day (2026-08-18) with no fixed version yet. lib/pq is a direct,
  # intentional dependency (postgres database_observability component and the
  # postgres_exporter integration both use it to connect to user-configured 
  # PostgreSQL servers). Short  2-week expiry so we re-check for a fixed
  # lib/pq release or mitigation.
  - id: GO-2026-6166
    reason: |
      GSSAPI authentication bypass in github.com/lib/pq (CVE-2026-56868): the
      driver accepts AuthenticationOk/ReadyForQuery without requiring
      cryptographic completion of GSSAPI auth. No fixed version available yet.
    expires: 2026-09-01

  - id: GO-2026-6168
    reason: |
      Unbounded SCRAM iteration count in github.com/lib/pq/scram
      (CVE-2026-56869) lets a malicious/compromised Postgres server force
      excessive PBKDF2-style HMAC rounds on the client, consuming CPU before
      the server signature is verified. No fixed version available yet.
    expires: 2026-09-01

  - id: GO-2026-6169
    reason: |
      Credential disclosure in github.com/lib/pq (CVE-2026-56870): when
      hostaddr is set without host, .pgpass lookup still uses the default
      Config.Host ("localhost"), so local credentials can be sent to a
      different remote endpoint. No fixed version available yet.
    expires: 2026-09-01

  - id: GO-2026-6170
    reason: |
      Panic on negative frame length in github.com/lib/pq (CVE-2026-56871):
      an unvalidated backend frame length of 0-3 bytes underflows, causing
      recvMessage to panic with a negative slice bound and crash the process.
      No fixed version available yet.
    expires: 2026-09-01

  - id: GO-2026-6171
    reason: |
      Panic on malformed RowDescription/DataRow in github.com/lib/pq
      (CVE-2026-56872): attacker-controlled row payloads are decoded without
      validating structure or value widths, causing unrecovered runtime
      panics. No fixed version available yet.
    expires: 2026-09-01

  - id: GO-2026-6172
    reason: |
      Memory exhaustion in github.com/lib/pq (CVE-2026-56873): a backend
      frame header declaring a multi-gigabyte or invalid-phase payload is
      allocated before any length bound or phase check, leading to OOM.
      No fixed version available yet.
    expires: 2026-09-01

  - id: GO-2026-6173
    reason: |
      Pre-protocol error reader permits unbounded memory consumption in
      github.com/lib/pq. No fixed version available yet.
    expires: 2026-09-01
