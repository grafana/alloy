excludes:
  # The monolithic github.com/knadh/koanf v1.5.0 ships packages (parsers/yaml, providers/rawbytes,
  # maps, ...) at the same import paths as the modular koanf/* modules. cmd/opampsupervisor and
  # go.opentelemetry.io/collector/confmap require the modular form, so exclude the monolith to
  # resolve the "ambiguous import" error during `go mod tidy`.
  - github.com/knadh/koanf v1.5.0

replaces:
  # Local modules.
  - github.com/grafana/alloy => ../
  - github.com/grafana/alloy/syntax => ../syntax
  # <BEGIN_SHARED_REPLACE_DIRECTIVES>
  # The OTel supervisor that's embedded in Alloy imports cmd/opampsupervisor, but OCB does not list it as a component.
  # This would cause `go mod tidy` to resolve it to @latest
  # Pin it to current contrib train version to prevent this.
  - github.com/open-telemetry/opentelemetry-collector-contrib/cmd/opampsupervisor => github.com/open-telemetry/opentelemetry-collector-contrib/cmd/opampsupervisor v0.161.0
  # Replace yaml.v2 with fork
  - gopkg.in/yaml.v2 => github.com/rfratto/go-yaml v0.0.0-20211119180816-77389c3526dc
  # Replace directives from Loki — Azure SDK
  - github.com/Azure/azure-sdk-for-go => github.com/Azure/azure-sdk-for-go v68.0.0+incompatible
  # Replace directives from Loki — Azure storage blob fork
  - github.com/Azure/azure-storage-blob-go => github.com/MasslessParticle/azure-storage-blob-go v0.14.1-0.20240322194317-344980fda573
  # Use fork of gocql that has gokit logs and Prometheus metrics
  - github.com/gocql/gocql => github.com/grafana/gocql v0.0.0-20200605141915-ba5dc39ece85
  # Insist on the optimised version of grafana/regexp
  - github.com/grafana/regexp => github.com/grafana/regexp v0.0.0-20240518133315-a468a5bfb3bc
  # Replace memberlist with Grafana fork which includes unmerged upstream fixes
  - github.com/hashicorp/memberlist => github.com/grafana/memberlist v0.3.1-0.20260515134459-1798cf41aca7
  # Use forked syslog implementation by leodido for continued support
  - github.com/influxdata/go-syslog/v3 => github.com/leodido/go-syslog/v4 v4.3.0
  # Replace thanos-io/objstore with Grafana fork
  - github.com/thanos-io/objstore => github.com/grafana/objstore v0.0.0-20250210100727-533688b5600d
  # TODO - remove forks when changes are merged upstream — non-singleton cadvisor Fork branch: https://github.com/grafana/cadvisor/tree/grafana-v0.60.5-noglobals
  - github.com/google/cadvisor => github.com/grafana/cadvisor v0.0.0-20260914142459-6f984a063abc
  # cadvisor v0.60 split its /lib submodule out; its local replace is ignored from a dependency, so redirect /lib to the fork here too.
  - github.com/google/cadvisor/lib => github.com/grafana/cadvisor/lib v0.0.0-20260914142459-6f984a063abc
  # TODO - this tracks exporter-package-v0.19.1 branch of grafana fork; remove once all patches are merged upstream
  - github.com/prometheus-community/postgres_exporter => github.com/grafana/postgres_exporter v0.0.0-20260225165717-9c2c77e3702a
  # TODO - this tracks exporter-package-v0.19.0 branch of grafana fork; remove once all patches are merged upstream
  - github.com/prometheus/mysqld_exporter => github.com/grafana/mysqld_exporter v0.0.0-20260319134024-e0461af8db16
  # TODO: replace node_exporter with custom fork for multi usage. https://github.com/prometheus/node_exporter/pull/2812
  - github.com/prometheus/node_exporter => github.com/grafana/node_exporter v0.18.1-grafana-r01.0.20251024135609-318b01780c89
  # TODO - tracks kgeckhart/yet-another-cloudwatch-exporter fix-name-validation-global; stops YACE mutating the process-global metric-name validation scheme. Remove once merged upstream.
  - github.com/prometheus-community/yet-another-cloudwatch-exporter => github.com/kgeckhart/yet-another-cloudwatch-exporter v0.64.1-0.20260629154816-440211eac126
  # Use Grafana fork of smimesign
  - github.com/github/smimesign => github.com/grafana/smimesign v0.2.1-0.20220408144937-2a5adf3481d3
  # Replace OpenTelemetry eBPF profiler with Grafana fork
  - go.opentelemetry.io/ebpf-profiler => github.com/grafana/opentelemetry-ebpf-profiler v0.0.202602-0.20260724100839-b73e704d1c59
  # Update openshift/client-go to version compatible with structured-merge-diff v6
  - github.com/openshift/client-go => github.com/openshift/client-go v0.0.0-20251015124057-db0dee36e235
  # Pin runc to v1.3.6: cadvisor and other deps import runc libcontainer packages
  # (intelrdt, user) that v1.4+ removed, so runc cannot float higher.
  - github.com/opencontainers/runc => github.com/opencontainers/runc v1.3.6
  # Fork hashicorp/vault to replace obsolete aws-sdk-go with aws-sdk-go-v2 (see: https://github.com/grafana/alloy/issues/2936). Fork branch: https://github.com/DataDog/vault/tree/master. Remove when https://github.com/hashicorp/vault/issues/29884 is resolved.
  - github.com/hashicorp/vault/api/auth/aws => github.com/DataDog/vault/api/auth/aws v0.0.0-20250716193101-44fb30472101
  # Work around DataDog split module ambiguity for pkg/util/system/socket by pinning util/system to the same rc stream used by current datadogexporter deps. Remove when https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/45955 (and follow-up releases) fully align DataDog modules.
  - github.com/DataDog/datadog-agent/pkg/util/system => github.com/DataDog/datadog-agent/pkg/util/system v0.76.0-rc.2
  # Cherry-pick of https://github.com/prometheus/prometheus/pull/19218 so Remote Write v2 metadata stops shrinking the remote_write shard count.
  # TODO - tracks the prometheus-314-metadata-shard-calculator-patch branch of the Grafana fork; drop at the Prometheus 3.15 bump, which has the fix upstream.
  - github.com/prometheus/prometheus => github.com/grafana/prometheus v1.8.2-0.20260917201616-6ac45be9754c
  # <END_SHARED_REPLACE_DIRECTIVES>
