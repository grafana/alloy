config: |
  loki.relabel "firehose" {
    forward_to = []

    rule {
      source_labels = ["__aws_firehose_source_arn"]
      target_label  = "source_arn"
    }

    rule {
      source_labels = ["__aws_cw_log_group"]
      target_label  = "log_group"
    }

    rule {
      source_labels = ["__aws_cw_msg_type"]
      target_label  = "msg_type"
    }
  }

  loki.source.awsfirehose "default" {
    http {
      listen_address = "127.0.0.1"
      listen_port    = 1517
    }

    // Use the timestamps from the requests and log events, so the test can
    // assert them exactly.
    use_incoming_timestamp = true

    relabel_rules = loki.relabel.firehose.rules
    forward_to    = [loki.process.default.receiver]
  }

  loki.process "default" {
    stage.structured_metadata {
      values = {
        log_group = "",
        msg_type  = "",
      }
    }

    forward_to = [loki.relabel.default.receiver]
  }

  loki.relabel "default" {
    forward_to = [pipelinetest.loki.receiver]

    rule {
      source_labels = ["source_arn"]
      target_label  = "service_name"
    }

    rule {
      action = "labeldrop"
      regex  = "source_arn|log_group|msg_type"
    }
  }

inputs:
  http:
    # Direct PUT records: each record's data is a base64-encoded log line.
    - url: http://127.0.0.1:1517/awsfirehose/api/v1/push
      headers:
        Content-Type: application/json
        X-Amz-Firehose-Request-Id: direct-put-1
        X-Amz-Firehose-Source-Arn: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-1
        X-Amz-Firehose-Protocol-Version: "1.0"
      expected_status: 200
      body: '{"requestId":"direct-put-1","timestamp":1767225600000,"records":[{"data":"bG9nIGxpbmUgMCBmcm9tIHN0cmVhbS0x"},{"data":"bG9nIGxpbmUgMSBmcm9tIHN0cmVhbS0x"}]}'
    - url: http://127.0.0.1:1517/awsfirehose/api/v1/push
      headers:
        Content-Type: application/json
        X-Amz-Firehose-Request-Id: direct-put-2
        X-Amz-Firehose-Source-Arn: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-2
        X-Amz-Firehose-Protocol-Version: "1.0"
      expected_status: 200
      body: '{"requestId":"direct-put-2","timestamp":1767225602000,"records":[{"data":"bG9nIGxpbmUgMCBmcm9tIHN0cmVhbS0y"},{"data":"bG9nIGxpbmUgMSBmcm9tIHN0cmVhbS0y"}]}'

    # A CloudWatch Logs record: its data is a gzip-compressed, base64-encoded
    # CloudWatch Logs subscription record with two log events. The readable
    # record is cwLogsRecord in cwlogs_test.go, which also checks this blob
    # still decodes to it and prints a fresh one when it changes.
    - url: http://127.0.0.1:1517/awsfirehose/api/v1/push
      headers:
        Content-Type: application/json
        X-Amz-Firehose-Request-Id: cw-logs-1
        X-Amz-Firehose-Source-Arn: arn:aws:firehose:us-east-1:123456789012:deliverystream/cw-stream
        X-Amz-Firehose-Protocol-Version: "1.0"
      expected_status: 200
      body: '{"requestId":"cw-logs-1","timestamp":1767225604000,"records":[{"data":""}]}'

assert:
  loki:
    # Six records in, six entries out: two per Direct PUT stream, and one per
    # CloudWatch log event.
    - type: count
      count: 6
    - type: count
      count: 2
      match:
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-1
    - type: count
      count: 2
      match:
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-2
    - type: count
      count: 2
      match:
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/cw-stream

    # A Direct PUT record becomes one entry with the request's timestamp. Its
    # source ARN becomes service_name, and an exact match proves source_arn is
    # not left as a label.
    - type: contains
      match:
        line: log line 0 from stream-1
        timestamp: "2026-01-01T00:00:00Z"
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-1
    - type: contains
      match:
        line: log line 1 from stream-1
        timestamp: "2026-01-01T00:00:00Z"
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-1
    - type: contains
      match:
        line: log line 0 from stream-2
        timestamp: "2026-01-01T00:00:02Z"
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-2
    - type: contains
      match:
        line: log line 1 from stream-2
        timestamp: "2026-01-01T00:00:02Z"
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/stream-2

    # Each CloudWatch log event becomes one entry with its own timestamp. The
    # log group and message type move to structured metadata, and exact
    # matches prove they are not left as labels.
    - type: contains
      match:
        line: cw log event 0 from cw-stream
        timestamp: "2026-01-01T00:00:04Z"
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/cw-stream
        structured_metadata:
          values:
            log_group: /aws/lambda/test-function
            msg_type: DATA_MESSAGE
    - type: contains
      match:
        line: cw log event 1 from cw-stream
        timestamp: "2026-01-01T00:00:05Z"
        labels:
          values:
            service_name: arn:aws:firehose:us-east-1:123456789012:deliverystream/cw-stream
        structured_metadata:
          values:
            log_group: /aws/lambda/test-function
            msg_type: DATA_MESSAGE
