config: |
  loki.relabel "gcplog" {
    forward_to = []

    rule {
      source_labels = ["__gcp_resource_type"]
      target_label  = "service_name"
    }

    rule {
      source_labels = ["__gcp_resource_labels_cluster_name"]
      target_label  = "cluster"
    }

    rule {
      source_labels = ["__gcp_resource_labels_bucket_name"]
      target_label  = "bucket"
    }

    rule {
      source_labels = ["__gcp_severity"]
      target_label  = "severity"
    }

    rule {
      source_labels = ["__gcp_logname"]
      target_label  = "log_name"
    }

    rule {
      source_labels = ["__gcp_subscription_name"]
      target_label  = "subscription"
    }

    rule {
      source_labels = ["__tenant_id__"]
      target_label  = "tenant_id"
    }
  }

  loki.source.gcplog "push" {
    push {
      http {
        listen_address = "127.0.0.1"
        listen_port    = 1518
      }

      // Keep the entries' timestamps, so the test can assert them exactly.
      use_incoming_timestamp = true
    }

    relabel_rules = loki.relabel.gcplog.rules
    forward_to    = [loki.process.default.receiver]
  }

  loki.process "default" {
    stage.structured_metadata {
      values = {
        severity     = "",
        log_name     = "",
        subscription = "",
        tenant_id    = "",
      }
    }

    forward_to = [loki.relabel.default.receiver]
  }

  // Drop the labels moved to structured metadata.
  loki.relabel "default" {
    forward_to = [pipelinetest.loki.receiver]

    rule {
      action = "labeldrop"
      regex  = "severity|log_name|subscription|tenant_id"
    }
  }

# GCP Pub/Sub push envelopes with base64-encoded log entries. Generated by envelopes_test.go.
inputs:
  http:
    # logEntries[0]: k8s_cluster, cluster_name=dev-us-central-42
    - url: http://127.0.0.1:1518/gcp/api/v1/push
      headers:
        Content-Type: application/json
      expected_status: 204
      body: '{"message":{"data":"","messageId":"0"},"subscription":"projects/test-project/subscriptions/test-push-sub"}'
    # logEntries[1]: gcs_bucket, bucket_name=loki-bucket
    - url: http://127.0.0.1:1518/gcp/api/v1/push
      headers:
        Content-Type: application/json
      expected_status: 204
      body: '{"message":{"data":"","messageId":"1"},"subscription":"projects/test-project/subscriptions/test-push-sub"}'
    # logEntries[2]: cloud_function, no cluster or bucket label
    - url: http://127.0.0.1:1518/gcp/api/v1/push
      headers:
        Content-Type: application/json
      expected_status: 204
      body: '{"message":{"data":"","messageId":"2"},"subscription":"projects/test-project/subscriptions/test-push-sub"}'
    # logEntries[3]: k8s_cluster, cluster_name=tenant-cluster, sent with a tenant
    - url: http://127.0.0.1:1518/gcp/api/v1/push
      headers:
        Content-Type: application/json
        X-Scope-OrgID: "42"
      expected_status: 204
      body: '{"message":{"data":"","messageId":"3"},"subscription":"projects/test-project/subscriptions/test-push-sub"}'

assert:
  loki:
    - type: count
      count: 4

    # The resource type becomes service_name, the cluster and bucket resource
    # labels become labels, and severity, log name, subscription and tenant move
    # to structured metadata. Exact matches prove no other label is left.
    - type: contains
      match:
        line: "k8s_cluster message 0"
        timestamp: "2026-01-01T00:00:00Z"
        labels:
          values:
            service_name: k8s_cluster
            cluster: dev-us-central-42
        structured_metadata:
          values:
            severity: INFO
            log_name: projects/test-project/logs/integration-test
            subscription: projects/test-project/subscriptions/test-push-sub
    - type: contains
      match:
        line: "gcs_bucket message 0"
        timestamp: "2026-01-01T00:00:01Z"
        labels:
          values:
            service_name: gcs_bucket
            bucket: loki-bucket
        structured_metadata:
          values:
            severity: INFO
            log_name: projects/test-project/logs/integration-test
            subscription: projects/test-project/subscriptions/test-push-sub
    - type: contains
      match:
        line: "cloud_function message 0"
        timestamp: "2026-01-01T00:00:02Z"
        labels:
          values:
            service_name: cloud_function
        structured_metadata:
          values:
            severity: INFO
            log_name: projects/test-project/logs/integration-test
            subscription: projects/test-project/subscriptions/test-push-sub
    - type: contains
      match:
        line: "tenant k8s_cluster message 0"
        timestamp: "2026-01-01T00:00:03Z"
        labels:
          values:
            service_name: k8s_cluster
            cluster: tenant-cluster
            __tenant_id__: "42"
        structured_metadata:
          values:
            severity: INFO
            log_name: projects/test-project/logs/integration-test
            subscription: projects/test-project/subscriptions/test-push-sub
            tenant_id: "42"
