# Runs only on Windows, because the windows_exporter reads Windows counters.
os: windows
timeout: 2m
# Settings that windows_exporter v0.32 removed must still work and log a warning.
setup:
  files:
    - path: "{{TEMP_DIR}}/probe.txt"
      content: alloy
config: |
  prometheus.exporter.windows "default" {
    enabled_collectors = ["cpu", "filetime", "thermalzone"]

    filetime {
      file_patterns = ["{{TEMP_DIR}}\\probe*.txt"]
    }

    process {
      counter_version = 2
    }
  }

  prometheus.scrape "default" {
    targets    = prometheus.exporter.windows.default.targets
    forward_to = [prometheus.remote_write.default.receiver]

    scrape_interval = "5s"
    scrape_timeout  = "4s"
  }

  prometheus.remote_write "default" {
    endpoint {
      url = pipelinetest.prometheus.url

      // The test writes too few series to fill a batch, so without a short
      // deadline every send waits out the 5s default.
      queue_config {
        batch_send_deadline = "500ms"
      }
    }
  }

assert:
  prometheus:
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: windows_cpu_time_seconds_total
    # The filetime block now configures the file collector.
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: windows_file_size_bytes
          regex:
            file: '.*probe\.txt'
  logs:
    - contains: "the `filetime` collector and block are deprecated"
    - contains: "the `thermalzone` collector is removed"
    - contains: "the `counter_version` attribute inside the `process` block is deprecated"
