config: |
  prometheus.exporter.static "default" {
    text = `
  # HELP http_requests_total The total number of HTTP requests.
  # TYPE http_requests_total counter
  http_requests_total{method="post",code="200"} 1027
  http_requests_total{method="post",code="400"}    3

  # HELP http_request_duration_seconds A histogram of the request duration.
  # TYPE http_request_duration_seconds histogram
  http_request_duration_seconds_bucket{le="0.05"} 24054
  http_request_duration_seconds_bucket{le="0.1"} 33444
  http_request_duration_seconds_bucket{le="0.2"} 100392
  http_request_duration_seconds_bucket{le="0.5"} 129389
  http_request_duration_seconds_bucket{le="1"} 133988
  http_request_duration_seconds_bucket{le="+Inf"} 144320
  http_request_duration_seconds_sum 53423
  http_request_duration_seconds_count 144320
  `
  }

  prometheus.scrape "default" {
    targets    = prometheus.exporter.static.default.targets
    forward_to = [pipelinetest.prometheus.receiver]

    scrape_interval = "1s"
    scrape_timeout  = "500ms"
  }

assert:
  prometheus:
    # The counter keeps both series and their label sets.
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: http_requests_total
            method: post
            code: "200"
        value: 1027
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: http_requests_total
            method: post
            code: "400"
        value: 3

    # The classic histogram arrives as bucket, sum and count series.
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: http_request_duration_seconds_bucket
            le: "0.05"
        value: 24054
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: http_request_duration_seconds_bucket
            le: "+Inf"
        value: 144320
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: http_request_duration_seconds_sum
        value: 53423
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: http_request_duration_seconds_count
        value: 144320

    # The exporter publishes one target, so the scrape reports it as up.
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: up
        value: 1
