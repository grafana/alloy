# Runs only on Windows, because the windows_exporter reads Windows counters.
os: windows
# An empty exclude restores the windows_exporter v0.31 behavior and reads every
# task. That scrape takes minutes on a host with many tasks.
timeout: 8m
setup:
  commands:
    # A task in the root folder, which the default exclude does not match.
    - run: [schtasks, /Create, /TN, AlloyPipelineTest, /SC, ONCE, /ST, "23:59", /TR, cmd.exe, /F]
      cleanup: [schtasks, /Delete, /TN, AlloyPipelineTest, /F]
config: |
  prometheus.exporter.windows "default" {
    enabled_collectors = ["scheduled_task"]

    scheduled_task {
      exclude = ""
    }
  }

  prometheus.scrape "default" {
    targets    = prometheus.exporter.windows.default.targets
    forward_to = [prometheus.remote_write.default.receiver]

    scrape_interval = "5m"
    scrape_timeout  = "4m30s"
  }

  prometheus.remote_write "default" {
    endpoint {
      url = pipelinetest.prometheus.url

      // The test writes too few series to fill a batch, so without a short
      // deadline every send waits out the 5s default.
      queue_config {
        batch_send_deadline = "500ms"
      }
    }
  }

assert:
  prometheus:
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: windows_exporter_collector_success
            collector: "scheduled_task"
        value: 1
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: windows_scheduled_task_state
            task: /AlloyPipelineTest
    - type: contains
      match:
        labels:
          mode: partial
          values:
            __name__: windows_scheduled_task_state
          regex:
            task: '/Microsoft/.*'
