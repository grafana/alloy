clients:
  - url: http://localhost/loki/api/v1/push
scrape_configs:
  - job_name: example
    pipeline_stages:
      - match:
          pipeline_name: one
          selector: '{app="one"}'
          action: keep
          drop_counter_reason: "nope"
          stages:
            - docker: {}
            - match:
                pipeline_name: two
                selector: '{app="two"}'
                action: keep
                drop_counter_reason: "nope_two"
                stages:
                  - cri: { }
      - match:
          pipeline_name: three
          selector: '{app="three"}'
          action: drop
          drop_counter_reason: "nope_three"


    kubernetes_sd_configs:
      - role: pod
        kubeconfig_file: /home/toby/.kube/config

tracing: { enabled: false }
server: { register_instrumentation: false }