receivers:
  otlp:
    protocols:
      grpc:
      http:
        compression_algorithms:
        - "zlib"
        cors:
          allowed_origins:
          - "https://*.example.com"
          allowed_headers:
          - "X-Custom-Header"
          exposed_headers:
          - "X-Request-Id"
          max_age: 7200

exporters:
  otlp:
    endpoint: database:4317

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: []
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: []
      exporters: [otlp]
    traces:
      receivers: [otlp]
      processors: []
      exporters: [otlp]
