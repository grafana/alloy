receivers:
  otlp:
    protocols:
      grpc:

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:9000

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      exporters: [clickhouse]
