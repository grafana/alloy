extensions:
  text_encoding/custom:
    encoding: iso-8859-1
    marshaling_separator: " | "
    unmarshaling_separator: "\\s*\\|\\s*"
  json_log_encoding/custom:
    array_mode: false
    mode: body_with_inline_attributes
  azure_encoding:
  azure_encoding/custom:
    logs:
      time_formats: ["2006-01-02 15:04:05"]
      include_categories: ["FrontDoorAccessLog", "AzureCdnAccessLog"]
      exclude_categories: ["AzureCdnAccessLog"]
    metrics:
      time_formats: ["01/02/2006 15:04:05"]
      aggregations: ["count", "total"]
    traces:
      time_formats: ["2006-01-02T15:04:05Z"]

receivers:
  otlp:
    protocols:
      grpc:

exporters:
  debug:

service:
  extensions: [text_encoding/custom, json_log_encoding/custom, azure_encoding, azure_encoding/custom]
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
