name: Integration test (Windows exporter)
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'integration-tests/windows-exporter/**'
      - 'internal/component/prometheus/exporter/windows/**'
      - 'internal/static/integrations/windows_exporter/**'
      - 'internal/converter/internal/staticconvert/internal/build/windows_exporter.go'
      - 'go.mod'
      - 'go.sum'
      - 'collector/go.mod'
      - 'collector/go.sum'
      - 'internal/component/prometheus/exporter/*.go'
      - 'internal/static/integrations/collector_integration.go'
      - 'internal/service/http/**'
      - 'Makefile'
      - '.github/workflows/integration-test-windows-exporter.yml'

permissions:
  contents: read

jobs:
  integration_test_windows_exporter:
    name: Windows exporter integration test
    runs-on: github-hosted-windows-x64-large
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: v2026.5.18
          sha256: 62aad5146848c6fb278eff90558940bd5685bb3ba7e34d64fd4e6ec9ed431f0d
          install_args: go

      - name: Build Alloy and run the Windows exporter integration test
        # Same linker settings as the Windows unit tests, to keep MinGW from running out of memory.
        run: '& "C:/Program Files/git/bin/bash.exe" -c ''make GOFLAGS="-p=4" CGO_LDFLAGS="-Wl,--no-keep-memory" integration-test-windows-exporter'''
