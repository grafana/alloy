name: Test (Windows)
on:
  push:
    # TODO: Also run the tests when a Windows-specific features is changed.
    # For example, the Windows Exporter for Prometheus and Event Log tailers.
    branches:
      - main
  # TODO: Run the Windows tests for each PR?
  # For now we don't do it just because it takes time.
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test_windows:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'os:windows') || github.event_name == 'push' || github.event_name == 'merge_group' }}
    name: Test (Windows)
    runs-on: github-hosted-windows-x64-large
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Setup tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: v2026.9.13
        sha256: 5f049f26f4d4f689512df65c6d965221983429cafa71ef5f01452f7a446450be
        install_args: go

    - name: Test
      # To prevent MinGW from running out of memory when linking large binaries:
      # * Set --no-keep-memory on the linker so that it keeps memory low during linking at the cost of speed.
      # * Set the -p flag to limit concurrent Go build/test jobs to reduce memory usage.
      run: '& "C:/Program Files/git/bin/bash.exe" -c ''make GOFLAGS="-p=4" CGO_LDFLAGS="-Wl,--no-keep-memory" GO_TAGS="nodocker nonetwork" test'''
