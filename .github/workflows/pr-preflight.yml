name: PR Preflight

on:
  # SECURITY: This workflow uses pull_request_target so these checks report on fork
  # pull requests without waiting for a maintainer to approve the workflow run.
  #
  # - Nothing is checked out and nothing from the contributor is executed
  # - Only the base branch's copy of this workflow runs
  # - The PR body is read from the event payload, never template interpolation
  # - The job grants only pull-requests: read
  #
  # zizmor: ignore[dangerous-triggers] see above
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

concurrency:
  # Editing a title or description fires this repeatedly; only the last run matters.
  # Keyed on PR number because branch names are not unique across forks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: PR Preflight
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Read the title, body, and commit list.
    steps:
      - name: Ensure the title follows Conventional Commits 🔎
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Require conventional commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            ci
            chore
            revert
            proposal
          # Scope is optional
          requireScope: false
          # Disallow uppercase first letter in subject
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" must start with an uppercase letter.
            Example: "feat: Add new component" not "feat: add new component"

      # Every check runs even after an earlier one fails, so a contributor sees all
      # of the problems at once rather than one per round trip.
      - name: Ensure a brief description is present 📝
        if: ${{ !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEADING: '### Brief description of Pull Request'
          CONTRIBUTING: https://github.com/grafana/alloy/blob/main/docs/developer/contributing.md
        with:
          script: |
            const body = (context.payload.pull_request.body ?? "")
              .replace(/\r/g, "")
              .replace(/<!--[\s\S]*?-->/g, "");

            const heading = process.env.HEADING;
            const headingOffset = body.indexOf(heading);

            let description;
            let label;

            if (headingOffset >= 0) {
              const sectionStart = headingOffset + heading.length;
              const nextHeading = body.indexOf("\n###", sectionStart);

              description = body.slice(
                sectionStart,
                nextHeading === -1 ? undefined : nextHeading,
              );
              label = `The "${heading}" section`;
            } else {
              // A PR may deliberately omit the template; require prose somewhere.
              description = body;
              label = "The pull request description";
            }

            if (/\S/.test(description) === false) {
              core.setFailed(
                `${label} is empty. Alloy squashes with the pull request body as ` +
                `the commit message, so it needs a factual summary of what changed. ` +
                `See ${process.env.CONTRIBUTING}`,
              );
              return;
            }

            core.info(`${label} is filled in.`);

      - name: Ensure all commits are signed 🔑
        if: ${{ !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CONTRIBUTING: https://github.com/grafana/alloy/blob/main/docs/developer/contributing.md#signed-commits
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });

            const unsigned = commits.filter(
              (c) => c.commit.verification.verified === false,
            );

            if (unsigned.length === 0) {
              core.info("All commits have verified signatures.");
              return;
            }

            // Naming the commits in the annotation rather than the run summary: the
            // annotation is what a contributor reaches from the checks list.
            const list = unsigned
              .map((c) => `${c.sha.slice(0, 8)}  ${c.commit.message.split("\n")[0]}`)
              .join("\n");

            const count = unsigned.length === 1 ? "1 commit has" : `${unsigned.length} commits have`;

            core.setFailed(
              `${count} no verified signature, so this pull request cannot be merged. ` +
              `Re-sign and force-push to fix it.\n\n` +
              `${list}\n\nSee ${process.env.CONTRIBUTING}`,
            );
