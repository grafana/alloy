name: Check Linux container
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.chisel'
      - 'scripts/docker-containers'
      - '.github/workflows/check-linux-container.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.chisel'
      - 'scripts/docker-containers'
      - '.github/workflows/check-linux-container.yml'

permissions:
  contents: read

jobs:
  check-linux-container:
    uses: ./.github/workflows/publish-alloy-linux.yml
    permissions:
      contents: read
      id-token: write
    with:
      img-name: alloy-devel
      push: false

  check-linux-boringcrypto-container:
    uses: ./.github/workflows/publish-alloy-linux.yml
    permissions:
      contents: read
      id-token: write
    with:
      img-name: alloy-devel-boringcrypto
      push: false

  check-linux-distroless-container:
    uses: ./.github/workflows/publish-alloy-linux.yml
    permissions:
      contents: read
      id-token: write
    with:
      img-name: alloy-devel-distroless
      push: false

  check-linux-boringcrypto-distroless-container:
    uses: ./.github/workflows/publish-alloy-linux.yml
    permissions:
      contents: read
      id-token: write
    with:
      img-name: alloy-devel-boringcrypto-distroless
      push: false
