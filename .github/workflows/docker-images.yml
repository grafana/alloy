name: Check Docker images

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.chisel
      - Dockerfile.windows
      - Makefile
      - 'build-tools/make/*'

permissions:
  contents: read

jobs:
  # NOTE(rfratto): We only test building the Docker images for the host
  # platform, but we're really only looking for issues that are
  # architecture-independent.
  linux:
    # We use a large runner for the additional disk space.
    runs-on: github-hosted-ubuntu-x64-large
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login to DockerHub
        # Authenticated pulls avoid the anonymous rate limit. Fork PRs have no OIDC token.
        # The build continues without a login if this step fails or is skipped.
        if: github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        uses: grafana/shared-workflows/actions/dockerhub-login@3ffeda28e54d6c8e02c3998594fafaf0a359328d # dockerhub-login/v2.0.0

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build -t alloy-test:latest -f Dockerfile .
      - name: Build distroless image
        run: |
          make ALLOY_IMAGE_DISTROLESS=alloy-test:distroless alloy-image-distroless

  windows:
    runs-on: windows-2025
    steps:
      - name: Ensure Docker is running (Docker issue workaround)
        id: docker-workaround
        run: |
          $dockerState = Get-Service -Name "docker"
          if ($dockerState.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build -t alloy-test:latest -f Dockerfile.windows .
