name: Integration Tests on Kubernetes
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Build the docker images the test suite needs (Alloy under test, plus
  # prom-gen as a scrape-target fixture and otel-gen as an OTLP sender) once
  # and ship them as a single artifact, so each shard in run_tests just
  # docker-loads them instead of rebuilding.
  build_images:
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Login to DockerHub
      # Authenticated pulls avoid the anonymous rate limit. Fork PRs have no OIDC token.
      # The build continues without a login if this step fails or is skipped.
      if: github.event.pull_request.head.repo.fork != true
      continue-on-error: true
      uses: grafana/shared-workflows/actions/dockerhub-login@3ffeda28e54d6c8e02c3998594fafaf0a359328d # dockerhub-login/v2.0.0

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: go
    - name: Build Alloy image
      run: make alloy-image-distroless
    - name: Build prom-gen image
      run: make prom-gen-image
    - name: Build otel-gen image
      run: make otel-gen-image
    - name: Save images
      run: docker save grafana/alloy:latest-distroless prom-gen:latest otel-gen:latest -o test-images.tar
    - name: Upload images artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-images
        path: test-images.tar
        retention-days: 1

  run_tests:
    needs: [build_images]
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: go helm kind
    - name: Download images artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: test-images
    - name: Load images
      run: docker load -i test-images.tar
    - name: Run tests
      run: make integration-test-k8s RUN_ARGS="--skip-image-builds --shard ${{ matrix.shard }}"
