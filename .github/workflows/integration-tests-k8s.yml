name: Integration Tests on Kubernetes
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run_tests:
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.11.7
          sha256: 8f5426d9971eaf713b37509749174ca69cf2f08b8b25e389168dcfcab9cd1a4d
          install_args: go helm kind
      - name: Download Alloy image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alloy-ci-distroless-${{ inputs.image_tag }}
      - name: Download fixture images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-images-fixtures
      - name: Load images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker load -i alloy-distroless.tar
          docker tag "alloy-ci:${IMAGE_TAG}-distroless" "grafana/alloy:${IMAGE_TAG}-distroless"
          docker load -i fixture-images.tar
      - name: Run tests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SHARD: ${{ matrix.shard }}
        run: make integration-test-k8s RUN_ARGS="--skip-image-builds --alloy-image grafana/alloy:${IMAGE_TAG} --shard ${SHARD}"
