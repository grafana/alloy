name: Integration Tests on Kubernetes
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Build the docker images the test suite needs (Alloy under test, plus
  # prom-gen as a scrape-target fixture) once and ship them as a single
  # artifact, so each shard in run_tests just docker-loads them instead of
  # rebuilding.
  build_images:
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: v2026.8.14
        sha256: 7cd12d6002d5b3c83a89cad79023712faf2a36f9e8b2ee2061dac5135b3de0ed
        install_args: go
    - name: Build Alloy image
      run: make alloy-image
    - name: Build prom-gen image
      run: make prom-gen-image
    - name: Save images
      run: docker save grafana/alloy:latest prom-gen:latest -o test-images.tar
    - name: Upload images artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-images
        path: test-images.tar
        retention-days: 1

  run_tests:
    needs: [build_images]
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: v2026.8.14
        sha256: 7cd12d6002d5b3c83a89cad79023712faf2a36f9e8b2ee2061dac5135b3de0ed
        install_args: go helm kind
    - name: Download images artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: test-images
    - name: Load images
      run: docker load -i test-images.tar
    - name: Run tests
      run: make integration-test-k8s RUN_ARGS="--skip-image-builds --shard ${{ matrix.shard }}"
