name: Integration Tests on Kubernetes
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run_tests:
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup tools
        uses: ./.github/actions/setup-nix
        with:
          devshell: k8s
      - name: Download Alloy image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alloy-ci-distroless-${{ inputs.image_tag }}
      - name: Download fixture images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-images-fixtures
      - name: Load images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker load -i alloy-distroless.tar
          docker tag "alloy-ci:${IMAGE_TAG}-distroless" "grafana/alloy:${IMAGE_TAG}-distroless"
          docker load -i fixture-images.tar
      - name: Run tests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SHARD: ${{ matrix.shard }}
        run: make integration-test-k8s RUN_ARGS="--skip-image-builds --alloy-image grafana/alloy:${IMAGE_TAG} --shard ${SHARD}"
