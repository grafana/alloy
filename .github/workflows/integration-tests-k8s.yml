name: Integration Tests on Kubernetes
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Build the docker images the test suite needs once and ship them as
  # artifacts, so each shard in run_tests just docker-loads them instead of
  # rebuilding. The Alloy image under test and the fixture images (prom-gen
  # as a scrape target, otel-gen as an OTLP sender) build in separate jobs,
  # so the fixtures don't wait for the much slower Alloy build.
  build_images:
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Login to DockerHub
      # Authenticated pulls avoid the anonymous rate limit. Fork PRs have no OIDC token.
      # The build continues without a login if this step fails or is skipped.
      if: github.event.pull_request.head.repo.fork != true
      continue-on-error: true
      uses: grafana/shared-workflows/actions/dockerhub-login@3ffeda28e54d6c8e02c3998594fafaf0a359328d # dockerhub-login/v2.0.0

    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.11.2
        sha256: 62cad463c1413f05398ca339168a8f655120b6f0b0b8adce3bc6758bafaf0602
        install_args: go
    - name: Build Alloy image
      # The check workflows verify that checked-in generated code is up to
      # date, so regenerating it here only adds time.
      run: SKIP_CODE_GENERATION=1 make alloy-image-distroless
    - name: Save image
      run: docker save grafana/alloy:latest-distroless -o alloy-image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-images-alloy
        path: alloy-image.tar
        retention-days: 1

  build_fixture_images:
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Login to DockerHub
      # Authenticated pulls avoid the anonymous rate limit. Fork PRs have no OIDC token.
      # The build continues without a login if this step fails or is skipped.
      if: github.event.pull_request.head.repo.fork != true
      continue-on-error: true
      uses: grafana/shared-workflows/actions/dockerhub-login@3ffeda28e54d6c8e02c3998594fafaf0a359328d # dockerhub-login/v2.0.0

    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.11.2
        sha256: 62cad463c1413f05398ca339168a8f655120b6f0b0b8adce3bc6758bafaf0602
        install_args: go
    - name: Build prom-gen image
      run: make prom-gen-image
    - name: Build otel-gen image
      run: make otel-gen-image
    - name: Save images
      run: docker save prom-gen:latest otel-gen:latest -o fixture-images.tar
    - name: Upload images artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-images-fixtures
        path: fixture-images.tar
        retention-days: 1

  run_tests:
    needs: [build_images, build_fixture_images]
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    runs-on:
      labels: github-hosted-ubuntu-x64-large
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.11.2
        sha256: 62cad463c1413f05398ca339168a8f655120b6f0b0b8adce3bc6758bafaf0602
        install_args: go helm kind
    - name: Download images artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-images-*
        merge-multiple: true
    - name: Load images
      run: |
        docker load -i alloy-image.tar
        docker load -i fixture-images.tar
    - name: Run tests
      run: make integration-test-k8s RUN_ARGS="--skip-image-builds --shard ${{ matrix.shard }}"
