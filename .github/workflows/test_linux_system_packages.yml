name: Test Linux system packages
on:
  push:
    branches:
      - main
    paths:
    - packaging/**
    - internal/tools/packaging_test/**
    - Makefile
    - build-tools/make/*.mk
    - .github/workflows/test_linux_system_packages.yml
  pull_request:
    paths:
    - packaging/**
    - internal/tools/packaging_test/**
    - Makefile
    - build-tools/make/*.mk
    - .github/workflows/test_linux_system_packages.yml

permissions:
  contents: read

jobs:
  build_linux_packages:
    name: Build Linux packages
    runs-on: ubuntu-latest-8-cores
    container:
      image: grafana/alloy-build-image:v0.1.35@sha256:9fa2a341b53503ce42cf9900c401d689a68ea67cdec6a20f53d72e3665fb8dc6
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set ownership
      # https://github.com/actions/runner/issues/2033#issuecomment-1204205989
      run: |
          # this is to fix GIT not liking owner of the checkout dir
          chown -R $(id -u):$(id -g) $PWD

    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: go

    - run: DOCKER_OPTS="" VERSION=v0.0.0 make dist/alloy-linux-amd64
    - run: DOCKER_OPTS="" VERSION=v0.0.0 make dist-alloy-packages-amd64

    - name: Upload packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux-packages
        path: |
          dist/alloy-0.0.0-1.amd64.deb
          dist/alloy-0.0.0-1.amd64.rpm
        if-no-files-found: error
        retention-days: 1

  test_linux_system_packages:
    name: Test Linux system packages
    needs: build_linux_packages
    runs-on: ubuntu-latest-8-cores
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: go

    - name: Download packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: linux-packages
        path: dist

    - name: Test Linux system packages
      env:
        ALLOY_SKIP_PACKAGE_BUILD: "1"
      run: go test -tags="gore2regex packaging" -race -timeout 30m ./internal/tools/packaging_test
