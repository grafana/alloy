name: Check alloy-scenarios documentation

on:
  pull_request:
    paths:
      - "docs/sources/scenarios/**"
      - "docs/sources/shared/scenarios/**"
      - "tools/scenarios-docs/**"
      - "build-tools/task/docs.yml"

permissions:
  contents: read

jobs:
  check-scenarios-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: go task

      - name: Test the generator
        run: go test -C tools ./scenarios-docs/...

      # Fails when a category has no page that imports its table, so a new
      # category in alloy-scenarios can't publish without a reviewed page.
      - name: Sync scenario documentation
        run: task docs:scenarios-sync

      - name: Check for changes
        run: |
          generated="docs/sources/shared/scenarios"
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            echo "The scenario documentation is out of date. Run 'task docs:scenarios-sync' and commit the result." >&2
            git status --short -- "$generated"
            git diff -- "$generated"
            exit 1
          fi
