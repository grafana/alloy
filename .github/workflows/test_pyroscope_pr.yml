name: Test Pyroscope PR
on:
  pull_request:

permissions:
  contents: read

jobs:
  test_pyroscope:
    name: Test pyroscope packages on Linux
    runs-on: ubuntu-latest
    if: >
      github.actor == 'korniltsev-grafanista' ||
      github.actor == 'simonswine' ||
      github.actor == 'aleks-p' ||
      github.actor == 'marcsanmi'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.9.13
          sha256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d
          install_args: go

      - run: sudo make test-pyroscope
