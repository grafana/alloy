name: Test Pyroscope PR
on:
  pull_request:

permissions:
  contents: read

jobs:
  test_pyroscope:
    name: Test pyroscope packages on Linux
    runs-on: ubuntu-latest
    if: >
      github.actor == 'korniltsev-grafanista' ||
      github.actor == 'simonswine' ||
      github.actor == 'aleks-p' ||
      github.actor == 'marcsanmi'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: v2026.11.2
          sha256: 62cad463c1413f05398ca339168a8f655120b6f0b0b8adce3bc6758bafaf0602
          install_args: go

      - run: sudo make test-pyroscope
