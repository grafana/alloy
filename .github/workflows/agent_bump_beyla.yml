name: Update Beyla Component From Release

on:
  workflow_dispatch:
    inputs:
      beyla_release_tag:
        description: Beyla release tag to sync from, for example v3.6.1
        required: true
        type: string
      source_ref:
        description: Alloy ref to branch from
        required: false
        default: main
        type: string

concurrency:
  group: agent-bump-beyla-${{ inputs.source_ref }}-${{ inputs.beyla_release_tag }}
  cancel-in-progress: true

env:
  ALLOYBOT_APP_NAME: grafana-alloybot

jobs:
  update-beyla:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write

    steps:
      - name: Get secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@a37de51f3d713a30a9e4b21bcdfbd38170020593 # get-vault-secrets/v1.3.0
        with:
          export_env: false
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic-token:token

      - name: Generate token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: ${{ env.ALLOYBOT_APP_NAME }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.9.13
          sha256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d

      - name: Update embedded Beyla release
        env:
          BEYLA_RELEASE_TAG: ${{ inputs.beyla_release_tag }}
        run: make update-beyla TAG="$BEYLA_RELEASE_TAG"

      - name: Get GitHub App identity
        id: get-app
        env:
          APP_SLUG: ${{ env.ALLOYBOT_APP_NAME }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_ID="$(gh api "/apps/${APP_SLUG}" --jq .id)"
          echo "app-id=${APP_ID}" >> "${GITHUB_OUTPUT}"
          echo "app-login=${APP_SLUG}[bot]" >> "${GITHUB_OUTPUT}"

      - name: Configure Git
        env:
          APP_ID: ${{ steps.get-app.outputs.app-id }}
          APP_LOGIN: ${{ steps.get-app.outputs.app-login }}
        run: |
          git config user.name "${APP_LOGIN}"
          git config user.email "${APP_ID}+${APP_LOGIN}@users.noreply.github.com"

      - name: Update config and documentation
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
        with:
          anthropic_api_key: ${{ fromJSON(steps.get-secrets.outputs.secrets).ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          use_commit_signing: "false"
          claude_args: "--max-turns 60 --allowedTools \"Bash(awk:*),Bash(cat:*),Bash(curl:*),Bash(date:*),Bash(gh:*),Bash(git:*),Bash(go:*),Bash(grep:*),Bash(head:*),Bash(jq:*),Bash(ls:*),Bash(make:*),Bash(mkdir:*),Bash(pwd:*),Bash(rg:*),Bash(sed:*),Bash(sort:*),Bash(tail:*),Bash(tr:*),Bash(wc:*),Edit,MultiEdit,Glob,Grep,LS,Read,Write,Task,TodoWrite\""
          prompt: |
            Update Alloy for Beyla `${{ inputs.beyla_release_tag }}`.

            `make update-beyla` has already updated the embedded binary version,
            checksums, config schema, and both docs index version files. Preserve those changes.
            Read `docs/developer/updating-beyla.md` and
            `internal/component/beyla/ebpf/internal/config/gen/README.md`.

            Compare the previous version in `git show HEAD:internal/component/beyla/ebpf/internal/config/gen/beyla/beyla_version.yaml`
            with the target release in `grafana/beyla`. Update
            `docs/sources/reference/components/beyla/beyla.ebpf.md` for changes affecting
            Alloy's exposed options, defaults, or behavior. Follow the repo's docs guidance.

            If required for compatibility, update the hand-written YAML translation and
            validation in `internal/component/beyla/ebpf/internal/config/` and add focused
            tests. New Beyla options do not automatically need exposing in Alloy.
            Regenerate golden YAML only for intentional translation changes, then rerun
            tests without `UPDATE_GOLDEN`. Keep unrelated code and Go modules unchanged.

            Verify the complete update:
            - `make lint`
            - `go test -race -tags=nodocker ./internal/component/beyla/ebpf/...`
            - `SKIP_UI_BUILD=1 make alloy`
            Review the checksum/schema diffs and confirm both docs index versions match
            the manifest. Do not publish if any check fails or there are no changes.

            Create branch `agent/bump-beyla-${{ inputs.beyla_release_tag }}` from the current
            checkout, retaining the generated changes. Commit only the release update and
            relevant config, tests, and docs, excluding downloaded binaries and local stamps.
            Use title and commit message `feat(beyla.ebpf): Bump to ${{ inputs.beyla_release_tag }}`.
            Push and open a draft PR against `${{ inputs.source_ref }}`. Do not force-push.
            Use `.github/pull_request_template.md`, fill only sections not marked `HUMAN ONLY`,
            and leave the checklist unchanged. Leave review discussion to humans.
