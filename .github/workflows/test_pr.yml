name: Test PR
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test_node:
    name: Test Node (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: UI
            directory: internal/web/ui
            command: npm run test:run
          - package: release-please-runner
            directory: build-tools/release-please-runner
            command: npm test
    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Setup tools
      uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: node

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Run tests
      run: ${{ matrix.command }}

  test_linux:
    name: Test Linux
    runs-on: ubuntu-latest-8-cores
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
          persist-credentials: false

    - name: Setup tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: go

    - run: make GO_TAGS="nodocker" test
