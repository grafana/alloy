name: Integration Tests
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: github-hosted-ubuntu-x64-large
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup tools
        uses: ./.github/actions/setup-nix
        with:
          devshell: go
      - name: Download Alloy image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alloy-ci-distroless-${{ inputs.image_tag }}
      - name: Load Alloy image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker load -i alloy-distroless.tar
          docker tag "alloy-ci:${IMAGE_TAG}-distroless" alloy-integration-tests:latest
      - name: Run tests
        run: make integration-test-docker RUN_ARGS="--skip-base-build"
